[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartqa"
version = "1.0.0"
description = "基于 LangChain 的课程知识库智能问答助手（支持在线 / 离线大模型）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "开源软件课程期末作业" }]
keywords = ["langchain", "rag", "llm", "streamlit", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
dependencies = [
    "langchain>=0.3.20,<0.4",
    "langchain-core>=0.3.72,<0.4",
    "langchain-text-splitters>=0.3.6,<0.4",
    "langchain-openai>=0.3.7,<0.4",
    "langchain-ollama>=0.2.3,<0.4",
    "streamlit>=1.40,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<7"]

[project.scripts]
smartqa = "smartqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
